  <head>

    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Top Banner Ad - Discreet horizontal banner -->
    <div class="ad-container ad-top">
      <!-- Fake ad placeholder -->
      <div class="fake-ad fake-ad-horizontal">
        <span>Advertisement</span>

    <div id="game-wrapper">

      <div class="ad-container ad-sidebar ad-left">

        </div>

      <!-- Game Container -->
      <div id="game-container"></div>

        <div class="fake-ad fake-ad-vertical">

      <!-- Fake ad placeholder -->
      <div class="fake-ad fake-ad-horizontal">
